<style>
:root{--navy:#1e2a5e;--navy-2:#2a3775;--ink:#eef0fb;--muted:#aeb5da;--teal:#7fbca9;--gold:#a8842c;--rose:#ffb4ab;
  --display:"Montserrat",ui-sans-serif,system-ui,sans-serif;--body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--ink);font-family:var(--body);font-size:16px;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(circle at 85% 10%,rgba(127,188,169,.18),transparent 45%)}
main{width:min(420px,100%);display:grid;gap:22px}
.logos{display:flex;align-items:center;gap:14px}
.logos img.sk{height:56px;width:auto}
.logos .x{color:var(--muted);font-family:var(--display)}
.logos .lg{background:#fff;border-radius:10px;padding:6px 12px;display:grid;place-items:center;height:56px}
.logos .lg img{height:42px;width:auto}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15;margin:0}
p{margin:0;color:var(--muted)}
form{display:grid;gap:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:22px}
label{display:grid;gap:6px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted)}
input{font:inherit;color:var(--ink);background:var(--navy-2);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:11px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button{font-family:var(--display);font-weight:700;font-size:15px;border:0;border-radius:999px;padding:12px 18px;background:var(--teal);color:#10173a;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--rose);font-size:14.5px;min-height:1.2em}
small{color:var(--muted);font-size:13.5px}
</style>
</head>

  <div>
    <h1>Projeto Laguardia</h1>
    <p>Cronograma, tarefas e entregas da equipe SKEMA.</p>
  </div>
  <form id="f">
    <label for="nome">Seu nome<input id="nome" name="nome" list="equipe" autocomplete="name" required maxlength="40" placeholder="Ex.: Gustavo"></label>
    <datalist id="equipe"><option value="Leticia Laguardia"><option value="Gustavo"><option value="Beatriz"><option value="Marina"><option value="Luan"><option value="Maurício"><option value="Catarina Assis"><option value="Antonio"><option value="Pérola"><option value="Rachel Patrocínio"></datalist>
    <label for="senha">Senha da equipe<input id="senha" name="senha" type="password" autocomplete="current-password" required></label>
    <div class="err" id="err" role="alert"></div>
    <button type="submit" id="btn">Entrar</button>
    <small>Entre <b>sempre com o mesmo nome</b>: é ele que guarda as suas tarefas e alterações. Maiúsculas e acentos não fazem diferença.</small>
  </form>
</main>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn');
try { const n = localStorage.getItem('lg-nome'); if(n) document.getElementById('nome').value = n; } catch(e) {}
f.addEventListener('submit', async ev => {
  ev.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Entrando…';
  const nome = f.nome.value.trim(), senha = f.senha.value;
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nome, senha}), credentials:'same-origin'});
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.error || 'Não deu para entrar.');
    if(j.nome && j.nome !== nome) { try { localStorage.setItem('lg-nome', j.nome); } catch(e) {} }
    try { localStorage.setItem('lg-nome', nome); } catch(e) {}
    location.href = '/';
  } catch(e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'Entrar'; }
});
</script>
